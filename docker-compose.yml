services:
  transcription_service:
    build: ./backend/transcription-service
    env_file:
      - backend/transcription-service/.env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_started
      faster-whisper:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/v1/health" ]
      timeout: 5s
      interval: 10m
      retries: 3

  db:
    image: postgres:17.6
    env_file:
      - backend/transcription-service/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    env_file:
      - backend/transcription-service/.env
    container_name: minio
    ports:
      - "9000:9000"  # MinIO API/Client port
      - "9001:9001"  # MinIO Console/Web UI port
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10m
      timeout: 20s
      retries: 3
    restart: always

  faster-whisper:
    container_name: speaches
    build:
      dockerfile: Dockerfile
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        BASE_IMAGE: ubuntu:24.04
    restart: unless-stopped
    ports:
      - "4000:8000"
    develop:
      watch:
        - action: rebuild
          path: ./uv.lock
        - action: sync+restart
          path: ./src
          target: /home/ubuntu/speaches/src
    env_file:
      - backend/transcription-service/.env
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    volumes:
      - faster_whisper_data:/home/ubuntu/.cache/huggingface/hub

volumes:
  postgres_data:
  minio_data:
  faster_whisper_data: