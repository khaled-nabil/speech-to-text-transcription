services:
  transcription_service:
    build: ./backend/transcription-service
    env_file:
      - backend/transcription-service/.env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/v1/health" ]
      timeout: 5s
      interval: 10m
      retries: 3
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-transcription_service_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

  db:
    image: postgres:17.6
    env_file:
      - backend/transcription-service/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-transcription_service_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    env_file:
      - backend/transcription-service/.env
    container_name: minio
    ports:
      - "9000:9000"  # MinIO API/Client port
      - "9001:9001"  # MinIO Console/Web UI port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-transcription_service_dev}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10m
      timeout: 20s
      retries: 3
    restart: always
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data: